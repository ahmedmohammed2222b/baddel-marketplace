
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بدّل | إدارة العروض</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f3f6f4;
  margin:0;
  padding:20px;
  color:#18332e;
}
header{
  background:#176b58;
  color:white;
  padding:22px;
  border-radius:14px;
}
header h2{margin-top:0}
main{max-width:1000px;margin:20px auto}
.stats,.card,.editor,#message{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:16px;
}
#count{
  font-size:30px;
  color:#176b58;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}
button{
  background:#176b58;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.card{
  border:1px solid #e1eae4;
  overflow-wrap:anywhere;
}
.card h3{color:#176b58}
.card p{margin:9px 0;line-height:1.6}
.back{background:#555}
.delete-btn{background:#b42318}
.edit-btn{background:#2563a6}
.card-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}
.editor{
  border:1px solid #176b58;
  margin-top:15px;
}
.editor h3{color:#176b58}
.field{margin-bottom:13px}
.field label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}
.field input,.field textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd8d0;
  border-radius:7px;
  font-size:15px;
  font-family:Arial;
}
.field textarea{min-height:100px;resize:vertical}
.editor-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.cancel-btn{background:#666}
#message{line-height:1.6}
</style>
</head>

<body>

<header>
  <h2>بدّل | إدارة المنتجات والعروض</h2>
  <p>لوحة تحكم الإدارة</p>
</header>

<main>

  <section class="stats">
    <h3>إجمالي العروض</h3>
    <div id="count">0</div>
    <p>عدد العروض الموجودة في قاعدة البيانات</p>
  </section>

  <div class="actions">
    <button id="refreshBtn">تحديث العروض</button>
    <button class="back" onclick="location.href='index.html'">
      العودة للموقع
    </button>
  </div>

  <div id="message">جاري التحقق من صلاحيات الإدارة...</div>
  <section id="listings"></section>

</main>

<script>
const supabaseUrl =
'https://wmubsxesiuqnircgxylt.supabase.co';

const supabaseKey =
'sb_publishable_PqX_Z9PoK7GoIhW0lCyEAw_1wOUI5mX';

const db = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const message = document.getElementById("message");
const listingsContainer = document.getElementById("listings");
const count = document.getElementById("count");
const refreshBtn = document.getElementById("refreshBtn");

let isAdmin = false;

const editableFields = [
  {key:"name",label:"اسم المنتج"},
  {key:"category",label:"التصنيف"},
  {key:"kind",label:"النوع"},
  {key:"condition",label:"الحالة"},
  {key:"price",label:"السعر",type:"number"},
  {key:"unit",label:"الوحدة"},
  {key:"wilaya",label:"الولاية"},
  {key:"city",label:"المدينة"},
  {key:"seller",label:"اسم البائع"},
  {key:"description",label:"الوصف",type:"textarea"},
  {key:"image_url",label:"رابط الصورة"},
  {key:"seller_phone",label:"هاتف البائع"}
];

function showMessage(text){
  message.textContent = text;
}

// التحقق من المدير
async function verifyAdminAndLoad(){

  refreshBtn.disabled = true;

  try{

    const {data:sessionData,error:sessionError} =
      await db.auth.getSession();

    if(sessionError) throw sessionError;

    if(!sessionData.session){
      showMessage("يرجى تسجيل الدخول أولاً.");
      count.textContent = "0";
      return;
    }

    const userId = sessionData.session.user.id;

    const {data:adminRecord,error:adminError} =
      await db
        .from("admins")
        .select("user_id")
        .eq("user_id",userId)
        .maybeSingle();

    if(adminError) throw adminError;

    if(!adminRecord){
      showMessage("ليس لديك صلاحية دخول لوحة الإدارة.");
      count.textContent = "0";
      return;
    }

    isAdmin = true;
    await loadListings();

  }catch(error){

    showMessage("حدث خطأ: " + error.message);

  }finally{

    refreshBtn.disabled = !isAdmin;

  }
}

// تحميل العروض
async function loadListings(){

  if(!isAdmin) return false;

  refreshBtn.disabled = true;
  showMessage("جاري تحميل العروض...");
  listingsContainer.replaceChildren();

  try{

    const {data,error} = await db
      .from("listings")
      .select("*")
      .order("created_at",{ascending:false});

    if(error) throw error;

    count.textContent = data.length;

    if(data.length === 0){
      showMessage("لا توجد عروض حالياً.");
      return true;
    }

    data.forEach((item,index)=>{

      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = item.name || "عرض رقم " + (index+1);
      card.appendChild(title);

      Object.entries(item).forEach(([key,value])=>{

        if(value === null || value === undefined || value === ""){
          return;
        }

        const p = document.createElement("p");
        p.textContent = key + ": " +
          (typeof value === "object"
            ? JSON.stringify(value)
            : value);

        card.appendChild(p);

      });

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "edit-btn";
      editBtn.textContent = "تعديل العرض";

      editBtn.addEventListener("click",()=>{
        openEditor(card,item,editBtn,deleteBtn);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "حذف العرض";

      deleteBtn.addEventListener("click",()=>{
        deleteListing(item.id,item.name,deleteBtn);
      });

      actions.append(editBtn,deleteBtn);
      card.appendChild(actions);

      listingsContainer.appendChild(card);

    });

    showMessage("تم تحميل العروض بنجاح.");
    return true;

  }catch(error){

    count.textContent = "—";
    showMessage("خطأ أثناء تحميل العروض: " + error.message);
    return false;

  }finally{

    refreshBtn.disabled = false;

  }
}

// فتح نموذج التعديل
function openEditor(card,item,editBtn,deleteBtn){

  if(!isAdmin) return;

  const oldEditor = card.querySelector(".editor");

  if(oldEditor){
    oldEditor.remove();
    return;
  }

  const editor = document.createElement("section");
  editor.className = "editor";

  const heading = document.createElement("h3");
  heading.textContent = "تعديل بيانات العرض";
  editor.appendChild(heading);

  const form = document.createElement("form");

  editableFields.forEach(field=>{

    const wrapper = document.createElement("div");
    wrapper.className = "field";

    const label = document.createElement("label");
    label.textContent = field.label;

    const input = field.type === "textarea"
      ? document.createElement("textarea")
      : document.createElement("input");

    if(field.type === "number"){
      input.type = "number";
      input.step = "any";
    }else if(field.type !== "textarea"){
      input.type = "text";
    }

    input.name = field.key;
    input.value = item[field.key] ?? "";

    wrapper.append(label,input);
    form.appendChild(wrapper);

  });

  const actions = document.createElement("div");
  actions.className = "editor-actions";

  const saveBtn = document.createElement("button");
  saveBtn.type = "submit";
  saveBtn.textContent = "حفظ التعديلات";

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "إلغاء";

  cancelBtn.addEventListener("click",()=>{
    editor.remove();
  });

  actions.append(saveBtn,cancelBtn);
  form.appendChild(actions);

  form.addEventListener("submit",async(event)=>{

    event.preventDefault();

    if(!isAdmin) return;

    const updates = {};

    for(const field of editableFields){

      const input = form.elements.namedItem(field.key);
      const value = input.value.trim();

      if(field.key === "price" && value !== ""){
        const numberValue = Number(value);

        if(!Number.isFinite(numberValue)){
          showMessage("يرجى إدخال سعر صحيح.");
          return;
        }

        updates[field.key] = numberValue;

      }else{
        updates[field.key] = value === "" ? null : value;
      }

    }

    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = "جاري الحفظ...";

    try{

      const {data,error} = await db
        .from("listings")
        .update(updates)
        .eq("id",item.id)
        .select("id");

      if(error) throw error;

      if(!data || data.length === 0){
        throw new Error("لم يتم حفظ التعديلات. تحقق من الصلاحيات.");
      }

      showMessage("تم تحديث العرض بنجاح.");
      await loadListings();

    }catch(error){

      showMessage("تعذر حفظ التعديلات: " + error.message);

      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.textContent = "حفظ التعديلات";

    }

  });

  editor.appendChild(form);
  card.appendChild(editor);

  editor.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

// حذف العرض
async function deleteListing(id,title,button){

  if(!isAdmin) return;

  if(!confirm('هل أنت متأكد من حذف العرض "' + (title || "") + '"؟')){
    return;
  }

  button.disabled = true;
  button.textContent = "جاري الحذف...";

  try{

    const {data,error} = await db
      .from("listings")
      .delete()
      .eq("id",id)
      .select("id");

    if(error) throw error;

    if(!data || data.length === 0){
      throw new Error("لم يتم حذف العرض. تحقق من الصلاحيات.");
    }

    await loadListings();
    showMessage("تم حذف العرض بنجاح.");

  }catch(error){

    showMessage("تعذر حذف العرض: " + error.message);
    button.disabled = false;
    button.textContent = "حذف العرض";

  }

}

// تحديث القائمة
refreshBtn.addEventListener("click",loadListings);

// التشغيل
verifyAdminAndLoad();

</script>

</body>
</html>
