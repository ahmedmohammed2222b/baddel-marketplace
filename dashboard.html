
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم بدّل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f3f6f4;margin:0;padding:25px;color:#18332e}
header{background:#176b58;color:white;padding:20px;border-radius:12px}
main{background:white;padding:20px;margin-top:20px;border-radius:12px}
button{background:#176b58;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<h2>بدّل | لوحة تحكم الإدارة</h2>
<p>مرحبًا بك في لوحة الإدارة</p>
</header>
<main>
<h3>لوحة التحكم</h3>
<p id="status">جاري التحقق من تسجيل الدخول...</p>
<button onclick="location.href='index.html'">العودة للموقع</button>
</main>
<script>
const supabaseUrl='https://wmubsxesiuqnircgxylt.supabase.co';
const supabaseKey='sb_publishable_PqX_Z9PoK7GoIhW0lCyEAw_1wOUI5mX';
const db=supabase.createClient(supabaseUrl,supabaseKey);

async function checkAdmin(){
 const {data,error}=await db.auth.getSession();
 if(error){
  document.getElementById('status').textContent=error.message;
  return;
 }
 if(!data.session){
  document.getElementById('status').textContent='يرجى تسجيل الدخول أولًا';
  return;
 }
 document.getElementById('status').textContent='تم تسجيل الدخول بنجاح';
}
checkAdmin();
</script>
</body>
</html>
