
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة عروض بدّل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f3f6f4;
  margin:0;
  padding:20px;
  color:#18332e;
}
header{
  background:#176b58;
  color:white;
  padding:22px;
  border-radius:14px;
}
header h2{margin-top:0}
main{
  max-width:1000px;
  margin:20px auto;
}
.stats{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}
#count{
  font-size:30px;
  color:#176b58;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}
button{
  background:#176b58;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:14px;
  border:1px solid #e1eae4;
  overflow-wrap:anywhere;
}
.card h3{color:#176b58}
.card p{margin:9px 0;line-height:1.6}
#message{
  background:white;
  padding:15px;
  border-radius:10px;
  margin:15px 0;
}
.back{background:#555}
.delete-btn{background:#b42318;margin-top:10px}
</style>
</head>

<body>

<header>
  <h2>بدّل | إدارة المنتجات والعروض</h2>
  <p>لوحة تحكم الإدارة</p>
</header>

<main>

  <section class="stats">
    <h3>إجمالي العروض</h3>
    <div id="count">0</div>
    <p>عدد العروض الموجودة في قاعدة البيانات</p>
  </section>

  <div class="actions">
    <button id="refreshBtn">تحديث العروض</button>

    <button class="back"
      onclick="location.href='index.html'">
      العودة للموقع
    </button>
  </div>

  <div id="message">جاري التحقق من صلاحيات الإدارة...</div>

  <section id="listings"></section>

</main>

<script>
const supabaseUrl =
'https://wmubsxesiuqnircgxylt.supabase.co';

const supabaseKey =
'sb_publishable_PqX_Z9PoK7GoIhW0lCyEAw_1wOUI5mX';

const db = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const message = document.getElementById("message");
const listingsContainer = document.getElementById("listings");
const count = document.getElementById("count");
const refreshBtn = document.getElementById("refreshBtn");

let isAdmin = false;

function showMessage(text){
  message.textContent = text;
}

// التحقق من صلاحية المدير
async function verifyAdminAndLoad(){

  refreshBtn.disabled = true;

  try{

    const {data:sessionData,error:sessionError} =
      await db.auth.getSession();

    if(sessionError) throw sessionError;

    if(!sessionData.session){

      showMessage("يرجى تسجيل الدخول أولاً.");
      count.textContent = "0";
      return;
    }

    const userId = sessionData.session.user.id;

    const {data:adminRecord,error:adminError} =
      await db
        .from("admins")
        .select("user_id")
        .eq("user_id",userId)
        .maybeSingle();

    if(adminError) throw adminError;

    if(!adminRecord){

      showMessage("ليس لديك صلاحية دخول لوحة الإدارة.");
      count.textContent = "0";
      return;
    }

    isAdmin = true;

    await loadListings();

  }catch(error){

    showMessage("حدث خطأ: " + error.message);

  }finally{

    refreshBtn.disabled = !isAdmin;

  }

}

// تحميل العروض
async function loadListings(){

  if(!isAdmin) return false;

  refreshBtn.disabled = true;
  showMessage("جاري تحميل العروض...");
  listingsContainer.replaceChildren();

  try{

    const {data,error} = await db
      .from("listings")
      .select("*");

    if(error) throw error;

    count.textContent = data.length;

    if(data.length === 0){

      showMessage("لا توجد عروض حالياً.");
      return true;
    }

    data.forEach((item,index)=>{

      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h3");

      const listingTitle =
        item.title || item.name || "عرض رقم " + (index+1);

      title.textContent = listingTitle;
      card.appendChild(title);

      Object.entries(item).forEach(([key,value])=>{

        if(value === null || value === undefined || value === ""){
          return;
        }

        const p = document.createElement("p");

        let displayedValue = value;

        if(typeof value === "object"){
          displayedValue = JSON.stringify(value);
        }

        p.textContent = key + ": " + displayedValue;
        card.appendChild(p);

      });

      // زر حذف العرض
      const deleteBtn = document.createElement("button");

      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "حذف العرض";

      deleteBtn.addEventListener("click",()=>{

        deleteListing(item.id,listingTitle,deleteBtn);

      });

      card.appendChild(deleteBtn);

      listingsContainer.appendChild(card);

    });

    showMessage("تم تحميل العروض بنجاح.");

    return true;

  }catch(error){

    count.textContent = "—";
    showMessage("حدث خطأ أثناء تحميل العروض: " + error.message);

    return false;

  }finally{

    refreshBtn.disabled = false;

  }

}

// حذف العرض من قاعدة البيانات
async function deleteListing(id,title,button){

  if(!isAdmin){
    showMessage("ليس لديك صلاحية الحذف.");
    return;
  }

  const confirmed = confirm(
    'هل أنت متأكد من حذف العرض "' + title + '"؟'
  );

  if(!confirmed) return;

  button.disabled = true;
  button.textContent = "جاري الحذف...";

  try{

    const {data,error} = await db
      .from("listings")
      .delete()
      .eq("id",id)
      .select("id");

    if(error) throw error;

    if(!data || data.length === 0){

      throw new Error(
        "لم يتم حذف العرض. تحقق من المعرّف وصلاحيات الحذف."
      );

    }

    const refreshed = await loadListings();

    if(refreshed){

      showMessage("تم حذف العرض بنجاح.");

    }else{

      showMessage(
        "تم حذف العرض، لكن تعذر تحديث القائمة. اضغط تحديث العروض."
      );

    }

  }catch(error){

    showMessage("تعذر حذف العرض: " + error.message);

    button.disabled = false;
    button.textContent = "حذف العرض";

  }

}

// تحديث العروض
refreshBtn.addEventListener("click",loadListings);

// بدء التشغيل
verifyAdminAndLoad();

</script>

</body>
</html>
